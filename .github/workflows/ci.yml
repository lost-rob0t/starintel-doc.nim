name: CI

on:
  push:
    branches:
      - dev
      - "agent/**"
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
      - run: nimble install -y
      - run: nimble test -y
