name: BuildAndTest

on: [push]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.4'
      - run: sudo apt-get update && sudo apt-get install -y libpcre3
      - run: "nimble install -y"
      - run: "testament all --megatest: off"
