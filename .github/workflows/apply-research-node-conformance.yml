name: Apply research node conformance update

on:
  push:
    branches: [agent/research-node-conformance]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/research-node-conformance

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Update alias registry and conformance pin
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("src/starintel_doc/v090.nim")
          text = source.read_text()
          anchor = '                     "email_message", "financial_observation", "research_pass", "dataset_manifest",\n'
          replacement = '                     "email_message", "financial_observation", "research_pass", "research_node",\n                     "dataset_manifest",\n'
          if '"research_node"' not in text:
              if anchor not in text:
                  raise SystemExit("missing Nim alias anchor")
              text = text.replace(anchor, replacement, 1)
          source.write_text(text)

          workflow = Path(".github/workflows/conformance.yml")
          text = workflow.read_text()
          old = "9f96fcf1852c65e100441c86c8a1c72843e760b8"
          new = "35ea4a7d1577133d52833d2815405e3966ecb5f2"
          if old not in text and new not in text:
              raise SystemExit("missing conformance pin anchor")
          workflow.write_text(text.replace(old, new))
          PY

      - name: Commit adapter update
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/starintel_doc/v090.nim .github/workflows/conformance.yml
          git commit -m "Support research-node conformance"
          git push origin HEAD:agent/research-node-conformance
