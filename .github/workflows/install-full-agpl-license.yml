name: Install full AGPLv3 license text

on:
  push:
    branches:
      - agent/license-agplv3

permissions:
  contents: write

jobs:
  install-license:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/license-agplv3
      - name: Install canonical GNU AGPLv3 text
        run: curl --fail --silent --show-error --location https://www.gnu.org/licenses/agpl-3.0.txt --output LICENSE
      - name: Remove one-time workflow
        run: rm .github/workflows/install-full-agpl-license.yml
      - name: Commit canonical license text
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add LICENSE .github/workflows/install-full-agpl-license.yml
          git commit -m "Install full GNU AGPLv3 license text"
          git push origin HEAD:agent/license-agplv3
